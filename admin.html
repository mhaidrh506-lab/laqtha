<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة تحكم لقطها</title>

<style>
  :root{
    --bg:#141110;
    --bg-soft:#1a1613;
    --surface:#201b17;
    --surface-raised:#26201b;
    --border:#372f27;
    --text:#f4efe4;
    --text-dim:#a99b87;
    --orange:#ff5a1f;
    --orange-dim:#e04d18;
    --tag-yellow:#ffc93c;
    --red:#e0524a;
    --font-display:'Almarai', sans-serif;
    --font-body:'IBM Plex Sans Arabic', sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;min-height:100vh;}
  h1,h2,h3{font-family:var(--font-display);margin:0;}
  button,input,select,textarea{font-family:inherit;}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
  .icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
  .icon-fill{fill:currentColor;stroke:none;}
  .icon-16{width:16px;height:16px;}
  .icon-28{width:28px;height:28px;}

  .wrap{max-width:900px;margin-inline:auto;padding:20px;}

  /* ---- login ---- */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:380px;}
  .login-logo{font-family:var(--font-display);font-weight:800;font-size:1.6rem;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .login-logo span{color:var(--orange);}
  .login-sub{color:var(--text-dim);font-size:0.9rem;margin-bottom:24px;}

  /* ---- shared form controls ---- */
  label{display:block;font-size:0.85rem;color:var(--text-dim);margin-bottom:6px;}
  .field{margin-bottom:16px;}
  input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
    width:100%;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:10px 12px;font-size:0.95rem;
  }
  textarea{resize:vertical;min-height:70px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:560px){.row2,.row3{grid-template-columns:1fr;}}

  button{cursor:pointer;border:none;border-radius:8px;font-weight:700;}
  .btn-primary{background:var(--orange);color:#1a1613;padding:11px 18px;font-size:0.95rem;width:100%;}
  .btn-primary:hover{background:var(--orange-dim);}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:10px 16px;}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dim);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);padding:6px 10px;font-size:0.82rem;}
  .btn-danger:hover{background:var(--red);color:#1a1613;}
  .btn-small{padding:6px 12px;font-size:0.82rem;}
  .error-msg{color:var(--red);font-size:0.85rem;margin-top:10px;display:none;}

  /* ---- admin header ---- */
  header.admin{position:sticky;top:0;background:rgba(20,17,16,0.95);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);z-index:10;}
  .admin-header-inner{max-width:900px;margin-inline:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .admin-logo{font-family:var(--font-display);font-weight:800;font-size:1.25rem;}
  .admin-logo span{color:var(--orange);}

  /* ---- product list ---- */
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin:20px 0;gap:12px;}
  .product-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .product-icon-wrap{width:44px;height:44px;border-radius:8px;background:var(--surface-raised);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .product-icon-wrap .icon{color:var(--orange);width:24px;height:24px;}
  .product-info{flex:1;min-width:0;}
  .product-name{font-weight:700;font-size:0.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .product-meta{color:var(--text-dim);font-size:0.82rem;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .product-actions{display:flex;gap:8px;flex-shrink:0;}
  .empty-state{color:var(--text-dim);text-align:center;padding:40px 20px;border:1px dashed var(--border);border-radius:12px;}

  /* ---- form panel ---- */
  #formPanel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;}
  #formPanel h2{font-size:1.1rem;margin-bottom:16px;}
  .icon-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;}
  .icon-opt{aspect-ratio:1;border:1px solid var(--border);border-radius:8px;background:var(--bg-soft);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .icon-opt.selected{border-color:var(--orange);color:var(--orange);background:var(--surface-raised);}
  .icon-opt .icon{width:18px;height:18px;}
  .form-actions{display:flex;gap:10px;margin-top:18px;}
  .form-actions .btn-primary{width:auto;flex:1;}
  .hint{color:var(--text-dim);font-size:0.78rem;margin-top:4px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-raised);
    border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:999px;font-size:0.88rem;
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginView">
  <div class="login-card">
    <div class="login-logo">لقطها<span>.</span></div>
    <div class="login-sub">لوحة التحكم — تسجيل الدخول</div>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">البريد الإلكتروني</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">كلمة المرور</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">تسجيل الدخول</button>
      <div class="error-msg" id="loginError"></div>
    </form>
  </div>
</div>

<!-- ============ ADMIN ============ -->
<div id="adminView" hidden>
  <header class="admin">
    <div class="admin-header-inner">
      <div class="admin-logo">لقطها <span>· لوحة التحكم</span></div>
      <button class="btn-ghost" id="logoutBtn"><svg class="icon icon-16"><use href="#icon-logout"></use></svg> خروج</button>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <h1 style="font-size:1.2rem;">المنتجات</h1>
      <button class="btn-primary" style="width:auto;" id="addNewBtn"><svg class="icon icon-16"><use href="#icon-plus"></use></svg> إضافة منتج</button>
    </div>

    <!-- form panel -->
    <div id="formPanel" hidden>
      <h2 id="formTitle">إضافة منتج جديد</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <div class="field">
          <label for="f_name">اسم المنتج</label>
          <input type="text" id="f_name" required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f_cat">الفئة</label>
            <select id="f_cat" required>
              <option value="electronics">إلكترونيات</option>
              <option value="fashion">الموضة</option>
              <option value="home">المنزل</option>
              <option value="beauty">الجمال</option>
              <option value="auto">السيارات</option>
            </select>
          </div>
          <div class="field">
            <label for="f_store">المتجر المعروض</label>
            <select id="f_store" required>
              <option value="amazon">Amazon</option>
              <option value="shein">SHEIN</option>
              <option value="trendyol">Trendyol</option>
            </select>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f_price">السعر (ريال)</label>
            <input type="number" id="f_price" min="0" step="0.01" required>
          </div>
          <div class="field">
            <label for="f_rating">التقييم (0–5)</label>
            <input type="number" id="f_rating" min="0" max="5" step="0.1" required>
          </div>
        </div>
        <div class="field">
          <label for="f_reason">سبب الترشيح (اختياري)</label>
          <textarea id="f_reason" rows="2"></textarea>
        </div>
        <div class="field">
          <label for="f_features">المميزات (سطر لكل ميزة، اختياري)</label>
          <textarea id="f_features" rows="3" placeholder="بطارية تدوم حتى 20 ساعة&#10;مقاومة للماء"></textarea>
        </div>
        <div class="field">
          <label>أيقونة المنتج</label>
          <div class="icon-picker" id="iconPicker"></div>
        </div>
        <div class="field">
          <label for="f_bg">خلفية البطاقة (تدرج CSS)</label>
          <input type="text" id="f_bg" placeholder="linear-gradient(135deg,#1e2a3a,#0f1620)">
          <div class="hint">انسخ أحد التدرجات من منتج مشابه بالموقع، أو اترك القيمة الافتراضية.</div>
        </div>
        <div class="row3">
          <div class="field">
            <label for="f_alt_amazon">سعر Amazon (اختياري)</label>
            <input type="number" id="f_alt_amazon" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="f_alt_shein">سعر SHEIN (اختياري)</label>
            <input type="number" id="f_alt_shein" min="0" step="0.01">
          </div>
          <div class="field">
            <label for="f_alt_trendyol">سعر Trendyol (اختياري)</label>
            <input type="number" id="f_alt_trendyol" min="0" step="0.01">
          </div>
        </div>
        <div class="hint">هذي الأسعار تُستخدم بجدول المقارنة بين المتاجر. سعر المتجر المعروض أعلاه يُنسخ تلقائيًا هنا عند الحفظ لو تركته فاضي.</div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="saveBtn">حفظ المنتج</button>
          <button type="button" class="btn-ghost" id="cancelFormBtn">إلغاء</button>
        </div>
        <div class="error-msg" id="formError"></div>
      </form>
    </div>

    <div id="productList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://zyfdthowwnzjbgrfhxkr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_myDCCzq3oHEKgKapC3yRBQ_0-A42nHo';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CAT_LABELS = { electronics:'إلكترونيات', fashion:'الموضة', home:'المنزل', beauty:'الجمال', auto:'السيارات' };
const STORE_LABELS = { amazon:'Amazon', shein:'SHEIN', trendyol:'Trendyol' };
const ICONS = ['electronics','fashion','home','beauty','auto','airfryer','smartwatch','backpack','shoe','perfume','chair','charger','sunglasses','skincare'];

const loginView = document.getElementById('loginView');
const adminView = document.getElementById('adminView');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const logoutBtn = document.getElementById('logoutBtn');
const productList = document.getElementById('productList');
const formPanel = document.getElementById('formPanel');
const productForm = document.getElementById('productForm');
const formError = document.getElementById('formError');
const iconPicker = document.getElementById('iconPicker');
const toastEl = document.getElementById('toast');

let selectedIcon = 'electronics';

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

/* ---------- auth ---------- */
async function checkSession(){
  const { data:{ session } } = await supabaseClient.auth.getSession();
  if(session){ enterAdmin(); } else { showLogin(); }
}
function showLogin(){ loginView.hidden = false; adminView.hidden = true; }
function enterAdmin(){ loginView.hidden = true; adminView.hidden = false; loadProducts(); }

loginForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  loginError.style.display = 'none';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'جارٍ الدخول...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'تسجيل الدخول';
  if(error){
    loginError.textContent = 'بيانات الدخول غير صحيحة. تأكد من البريد وكلمة المرور.';
    loginError.style.display = 'block';
    return;
  }
  enterAdmin();
});

logoutBtn.addEventListener('click', async ()=>{
  await supabaseClient.auth.signOut();
  showLogin();
});

/* ---------- icon picker ---------- */
function renderIconPicker(){
  iconPicker.innerHTML = ICONS.map(ic => `
    <button type="button" class="icon-opt${ic===selectedIcon?' selected':''}" data-icon="${ic}" title="${ic}">
      <svg class="icon"><use href="#icon-${ic}"></use></svg>
    </button>`).join('');
  iconPicker.querySelectorAll('.icon-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedIcon = btn.dataset.icon;
      iconPicker.querySelectorAll('.icon-opt').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
}
renderIconPicker();

/* ---------- product list ---------- */
async function loadProducts(){
  productList.innerHTML = '<div class="empty-state">جارٍ التحميل...</div>';
  const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending:false });
  if(error){
    productList.innerHTML = '<div class="empty-state">تعذر تحميل المنتجات: ' + error.message + '</div>';
    return;
  }
  if(!data || data.length === 0){
    productList.innerHTML = '<div class="empty-state">لا يوجد منتجات بعد. اضغط "إضافة منتج" لتبدأ.</div>';
    return;
  }
  productList.innerHTML = data.map(p => `
    <div class="product-item">
      <div class="product-icon-wrap"><svg class="icon"><use href="#icon-${p.visual_icon || 'electronics'}"></use></svg></div>
      <div class="product-info">
        <div class="product-name">${escapeHTML(p.name)}</div>
        <div class="product-meta">
          <span>${CAT_LABELS[p.cat] || p.cat}</span>
          <span>·</span>
          <span>${STORE_LABELS[p.store] || p.store}</span>
          <span>·</span>
          <span>${p.price} ريال</span>
          <span>·</span>
          <span>${p.rating} ★</span>
        </div>
      </div>
      <div class="product-actions">
        <button class="btn-ghost btn-small" data-edit="${p.id}"><svg class="icon icon-16"><use href="#icon-edit"></use></svg></button>
        <button class="btn-danger" data-delete="${p.id}"><svg class="icon icon-16"><use href="#icon-trash"></use></svg></button>
      </div>
    </div>`).join('');

  productList.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = data.find(p => String(p.id) === btn.dataset.edit);
      openForm(row);
    });
  });
  productList.querySelectorAll('[data-delete]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('متأكد تبي تحذف هذا المنتج؟ ما يرجع بعد الحذف.')) return;
      const { error } = await supabaseClient.from('products').delete().eq('id', btn.dataset.delete);
      if(error){ showToast('فشل الحذف: ' + error.message); return; }
      showToast('تم حذف المنتج');
      loadProducts();
    });
  });
}

function escapeHTML(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

/* ---------- form open/close ---------- */
document.getElementById('addNewBtn').addEventListener('click', ()=>openForm(null));
document.getElementById('cancelFormBtn').addEventListener('click', closeForm);

function openForm(product){
  formError.style.display = 'none';
  document.getElementById('formTitle').textContent = product ? 'تعديل منتج' : 'إضافة منتج جديد';
  document.getElementById('productId').value = product ? product.id : '';
  document.getElementById('f_name').value = product ? product.name : '';
  document.getElementById('f_cat').value = product ? product.cat : 'electronics';
  document.getElementById('f_store').value = product ? product.store : 'amazon';
  document.getElementById('f_price').value = product ? product.price : '';
  document.getElementById('f_rating').value = product ? product.rating : '';
  document.getElementById('f_reason').value = product ? (product.reason || '') : '';
  document.getElementById('f_features').value = product && Array.isArray(product.features) ? product.features.join('\n') : '';
  document.getElementById('f_bg').value = product ? (product.visual_bg || '') : '';
  document.getElementById('f_alt_amazon').value = product && product.alt_amazon != null ? product.alt_amazon : '';
  document.getElementById('f_alt_shein').value = product && product.alt_shein != null ? product.alt_shein : '';
  document.getElementById('f_alt_trendyol').value = product && product.alt_trendyol != null ? product.alt_trendyol : '';
  selectedIcon = product ? (product.visual_icon || 'electronics') : 'electronics';
  renderIconPicker();
  formPanel.hidden = false;
  formPanel.scrollIntoView({ behavior:'smooth', block:'start' });
}
function closeForm(){
  formPanel.hidden = true;
  productForm.reset();
}

/* ---------- form submit (insert/update) ---------- */
productForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  formError.style.display = 'none';
  const id = document.getElementById('productId').value;
  const store = document.getElementById('f_store').value;
  const price = parseFloat(document.getElementById('f_price').value);
  const featuresRaw = document.getElementById('f_features').value;
  const features = featuresRaw.split('\n').map(s=>s.trim()).filter(Boolean);

  const altVals = {
    alt_amazon: document.getElementById('f_alt_amazon').value,
    alt_shein: document.getElementById('f_alt_shein').value,
    alt_trendyol: document.getElementById('f_alt_trendyol').value,
  };
  // auto-fill the selected store's alt price with the main price if left empty
  const storeAltKey = 'alt_' + store;
  if(!altVals[storeAltKey]) altVals[storeAltKey] = price;

  const payload = {
    name: document.getElementById('f_name').value.trim(),
    cat: document.getElementById('f_cat').value,
    store: store,
    price: price,
    rating: parseFloat(document.getElementById('f_rating').value),
    reason: document.getElementById('f_reason').value.trim() || null,
    features: features,
    visual_icon: selectedIcon,
    visual_bg: document.getElementById('f_bg').value.trim() || 'linear-gradient(135deg,#1e2a3a,#0f1620)',
    alt_amazon: altVals.alt_amazon === '' ? null : parseFloat(altVals.alt_amazon),
    alt_shein: altVals.alt_shein === '' ? null : parseFloat(altVals.alt_shein),
    alt_trendyol: altVals.alt_trendyol === '' ? null : parseFloat(altVals.alt_trendyol),
  };

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true; saveBtn.textContent = 'جارٍ الحفظ...';

  let result;
  if(id){
    result = await supabaseClient.from('products').update(payload).eq('id', id);
  } else {
    result = await supabaseClient.from('products').insert(payload);
  }

  saveBtn.disabled = false; saveBtn.textContent = 'حفظ المنتج';

  if(result.error){
    formError.textContent = 'فشل الحفظ: ' + result.error.message;
    formError.style.display = 'block';
    return;
  }
  showToast(id ? 'تم تحديث المنتج' : 'تم إضافة المنتج');
  closeForm();
  loadProducts();
});

checkSession();
</script>
</body>
